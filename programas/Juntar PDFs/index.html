
<!DOCTYPE html>
<html>
<head>
  <title>Merge PDFs</title>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    body {
      padding: 25px;
      font-family: Arial, sans-serif;
    }
    .title {
      color: #5C6AC4;
    }
    #fileInput {
      margin: 10px 0;
    }
    #pdfList {
      margin: 10px 0;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
    }
    .pdf-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px;
      border-bottom: 1px solid #eee;
    }
    .pdf-item:last-child {
      border-bottom: none;
    }
    .drag-handle {
      cursor: move;
      padding: 0 10px;
    }
    button {
      padding: 10px 15px;
      background-color: #5C6AC4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover {
      background-color: #4a58a0;
    }
    #mergeBtn {
      background-color: #28a745;
    }
    #mergeBtn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h1 class="title">Mergear PDFs</h1>
  
  <div>
    <input type="file" id="fileInput" accept=".pdf" multiple />
    <br>
    <button onclick="mergePDFs()">Merge PDFs</button>
  </div>
  
  <div id="pdfList">
    <p>Arquivos selecionados:</p>
  </div>

  <script>
    let pdfFiles = [];
    
    document.getElementById('fileInput').addEventListener('change', function(e) {
      pdfFiles = Array.from(e.target.files);
      updatePDFList();
    });

    function updatePDFList() {
      const listContainer = document.getElementById('pdfList');
      listContainer.innerHTML = '<p>Arquivos selecionados:</p>';
      
      pdfFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'pdf-item';
        item.draggable = true;
        item.dataset.index = index;
        
        item.innerHTML = `
          <span>${file.name}</span>
          <span class="drag-handle">⋮⋮</span>
        `;
        
        item.addEventListener('dragstart', handleDragStart);
        item.addEventListener('dragover', handleDragOver);
        item.addEventListener('drop', handleDrop);
        item.addEventListener('dragend', handleDragEnd);
        
        listContainer.appendChild(item);
      });
    }

    let draggedItem = null;

    function handleDragStart(e) {
      draggedItem = this;
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e) {
      e.preventDefault();
      if (draggedItem !== this) {
        const draggedIndex = parseInt(draggedItem.dataset.index);
        const targetIndex = parseInt(this.dataset.index);
        
        // Reorder array
        const temp = pdfFiles[draggedIndex];
        pdfFiles.splice(draggedIndex, 1);
        pdfFiles.splice(targetIndex, 0, temp);
        
        updatePDFList();
      }
    }

    function handleDragEnd() {
      draggedItem = null;
    }

    async function mergePDFs() {
      if (pdfFiles.length === 0) {
        alert("Por favor, selecione pelo menos um arquivo PDF.");
        return;
      }

      try {
        const mergedPdf = await PDFLib.PDFDocument.create();
        
        for (let i = 0; i < pdfFiles.length; i++) {
          const file = pdfFiles[i];
          const bytes = await file.arrayBuffer();
          const pdfDoc = await PDFLib.PDFDocument.load(bytes);
          
          const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
          copiedPages.forEach(page => mergedPdf.addPage(page));
        }

        const mergedPdfBytes = await mergedPdf.save();
        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'merged.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (error) {
        console.error('Erro ao mesclar PDFs:', error);
        alert('Erro ao mesclar PDFs: ' + error.message);
      }
    }
  </script>
</body>
</html>
